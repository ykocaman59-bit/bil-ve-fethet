<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bil ve Fethet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d1117; color: #fff; text-align: center; }
    header { padding: 15px; background: #161b22; font-size: 18px; font-weight: bold; border-bottom: 2px solid #30363d; }
    
    #scoreboard { display: flex; justify-content: space-around; padding: 10px; background: #161b22; gap: 5px; }
    .player-card { flex: 1; padding: 10px 5px; border-radius: 6px; font-weight: bold; font-size: 13px; color: #fff; text-shadow: 1px 1px 2px #000; }
    
    #game-container { position: relative; max-width: 500px; margin: 15px auto; padding: 0 10px; }
    svg { width: 100%; height: auto; background: #1f2937; border-radius: 12px; border: 3px solid #374151; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    polygon { stroke: #0d1117; stroke-width: 3; cursor: pointer; transition: transform 0.2s, opacity 0.2s; }
    polygon:hover { opacity: 0.85; filter: brightness(1.2); }

    /* Soru Modalı */
    #question-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 999;
    }
    .modal-content {
      background: #1f2937; padding: 20px; border-radius: 12px; max-width: 400px; width: 90%; border: 1px solid #374151;
    }
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 15px; }
    .btn-option {
      padding: 14px; background: #3b82f6; color: #fff; border: none;
      border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; transition: background 0.2s;
    }
    .btn-option:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <header>🏰 BİL VE FETHET 🏰</header>

  <div id="scoreboard">
    <div class="player-card" style="background:#e74c3c">1. Oyuncu<br><span id="score-1">1000</span> P</div>
    <div class="player-card" style="background:#3498db">2. Oyuncu<br><span id="score-2">1000</span> P</div>
    <div class="player-card" style="background:#2ecc71">3. Oyuncu<br><span id="score-3">1000</span> P</div>
    <div class="player-card" style="background:#f1c40f; color:#000">4. Oyuncu<br><span id="score-4">1000</span> P</div>
  </div>

  <div id="game-container">
    <svg viewBox="0 0 400 300">
      <!-- 4 Harita Bölgesi -->
      <polygon id="region-1" points="10,10 195,10 185,145 10,145" fill="#e74c3c" onclick="selectRegion(1)" />
      <polygon id="region-2" points="205,10 390,10 390,145 195,145" fill="#3498db" onclick="selectRegion(2)" />
      <polygon id="region-3" points="10,155 185,155 195,290 10,290" fill="#2ecc71" onclick="selectRegion(3)" />
      <polygon id="region-4" points="195,155 390,155 390,290 205,290" fill="#f1c40f" onclick="selectRegion(4)" />
      
      <!-- Kale Simgeleri (Bölgelerin Ortalarında) -->
      <text x="90" y="85" font-size="24" text-anchor="middle" pointer-events="none">🏰</text>
      <text x="290" y="85" font-size="24" text-anchor="middle" pointer-events="none">🏰</text>
      <text x="90" y="230" font-size="24" text-anchor="middle" pointer-events="none">🏰</text>
      <text x="290" y="230" font-size="24" text-anchor="middle" pointer-events="none">🏰</text>
    </svg>
  </div>

  <!-- Soru Penceresi -->
  <div id="question-modal">
    <div class="modal-content">
      <h3 id="question-text" style="color: #f3f4f6; font-size: 16px;">Soru Yükleniyor...</h3>
      <div class="options-grid" id="options-container"></div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>

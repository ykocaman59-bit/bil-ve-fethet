<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bil ve Fethet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #1a1a2e; color: #fff; text-align: center; }
    header { padding: 15px; background: #16213e; font-size: 20px; font-weight: bold; }
    
    #scoreboard { display: flex; justify-content: space-around; padding: 10px; background: #0f3460; }
    .player-card { padding: 8px 15px; border-radius: 5px; font-weight: bold; }
    
    #game-container { position: relative; max-width: 800px; margin: 20px auto; }
    svg { width: 100%; height: auto; background: #0f3460; border-radius: 10px; }
    polygon, path { stroke: #ffffff; stroke-width: 2; cursor: pointer; transition: 0.3s; }
    polygon:hover, path:hover { opacity: 0.8; }

    /* Soru Modalı */
    #question-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); justify-content: center; align-items: center;
    }
    .modal-content {
      background: #16213e; padding: 25px; border-radius: 10px; max-width: 500px; width: 90%;
    }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .btn-option {
      padding: 12px; background: #e94560; color: #fff; border: none;
      border-radius: 5px; cursor: pointer; font-size: 16px;
    }
    .btn-option:hover { background: #ff6b81; }
  </style>
</head>
<body>

  <header>BİL VE FETHET - 4 OYUNCULU HARİTA SAVAŞI</header>

  <div id="scoreboard">
    <div class="player-card" style="background:#e74c3c">1. Oyuncu: <span id="score-1">1000</span> P</div>
    <div class="player-card" style="background:#3498db">2. Oyuncu: <span id="score-2">1000</span> P</div>
    <div class="player-card" style="background:#2ecc71">3. Oyuncu: <span id="score-3">1000</span> P</div>
    <div class="player-card" style="background:#f1c40f; color:#000">4. Oyuncu: <span id="score-4">1000</span> P</div>
  </div>

  <div id="game-container">
    <svg viewBox="0 0 400 300">
      <!-- 4 Farklı Bölge (Harita) -->
      <polygon id="region-1" points="0,0 200,0 180,150 0,150" fill="#e74c3c" onclick="selectRegion(1)" />
      <polygon id="region-2" points="200,0 400,0 400,150 180,150" fill="#3498db" onclick="selectRegion(2)" />
      <polygon id="region-3" points="0,150 180,150 200,300 0,300" fill="#2ecc71" onclick="selectRegion(3)" />
      <polygon id="region-4" points="180,150 400,150 400,300 200,300" fill="#f1c40f" onclick="selectRegion(4)" />
    </svg>
  </div>

  <!-- Soru Alanı -->
  <div id="question-modal">
    <div class="modal-content">
      <h3 id="question-text">Soru Yükleniyor...</h3>
      <div class="options-grid" id="options-container"></div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bil ve Fethet - Harita Savaşları</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #0f172a; color: #fff; text-align: center; }
    header { padding: 12px; background: #1e293b; font-size: 18px; font-weight: bold; border-bottom: 2px solid #334155; }
    
    #scoreboard { display: flex; justify-content: space-around; padding: 10px; background: #1e293b; gap: 5px; }
    .player-card { flex: 1; padding: 8px 4px; border-radius: 6px; font-weight: bold; font-size: 12px; }
    
    #game-container { position: relative; max-width: 600px; margin: 10px auto; padding: 0 10px; }
    #timer-bar { font-size: 16px; font-weight: bold; color: #ef4444; margin-bottom: 8px; }

    svg { width: 100%; height: auto; background: #1e3a8a; border-radius: 12px; border: 3px solid #3b82f6; }
    path { stroke: #0f172a; stroke-width: 2; cursor: pointer; transition: 0.2s; }
    path:hover { opacity: 0.8; filter: brightness(1.2); }
    text { font-weight: bold; pointer-events: none; user-select: none; }

    /* Modal Soru ve Bilgi Ekranı */
    #modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 999;
    }
    .modal-box {
      background: #1e293b; padding: 20px; border-radius: 12px; max-width: 400px; width: 90%; border: 1px solid #475569;
    }
    .btn-opt {
      display: block; width: 100%; padding: 12px; margin: 8px 0; background: #3b82f6; color: #fff;
      border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <header>🏰 BİL VE FETHET 🏰</header>

  <div id="scoreboard">
    <div id="p1" class="player-card" style="background:#ef4444">1. Kırmızı<br><span id="s1">0</span> P</div>
    <div id="p2" class="player-card" style="background:#3b82f6">2. Mavi<br><span id="s2">0</span> P</div>
    <div id="p3" class="player-card" style="background:#22c55e">3. Yeşil<br><span id="s3">0</span> P</div>
    <div id="p4" class="player-card" style="background:#eab308; color:#000">4. Sarı<br><span id="s4">0</span> P</div>
  </div>

  <div id="game-container">
    <div id="timer-bar">Süre: <span id="time-left">10</span>s | Aşama: <span id="phase-title">Bölge Seçimi</span></div>
    
    <svg viewBox="0 0 600 300" id="map-svg">
      <!-- 15 Türkiye Bölge Temsili Şeması -->
      <path id="reg-1" d="M 10,10 L 120,10 L 110,70 L 10,70 Z" fill="#94a3b8" onclick="handleRegionClick(1)"/>
      <path id="reg-2" d="M 120,10 L 240,10 L 220,70 L 110,70 Z" fill="#94a3b8" onclick="handleRegionClick(2)"/>
      <path id="reg-3" d="M 240,10 L 360,10 L 340,70 L 220,70 Z" fill="#94a3b8" onclick="handleRegionClick(3)"/>
      <path id="reg-4" d="M 360,10 L 480,10 L 460,70 L 340,70 Z" fill="#94a3b8" onclick="handleRegionClick(4)"/>
      <path id="reg-5" d="M 480,10 L 590,10 L 590,70 L 460,70 Z" fill="#94a3b8" onclick="handleRegionClick(5)"/>

      <path id="reg-6" d="M 10,70 L 110,70 L 100,150 L 10,150 Z" fill="#94a3b8" onclick="handleRegionClick(6)"/>
      <path id="reg-7" d="M 110,70 L 220,70 L 210,150 L 100,150 Z" fill="#94a3b8" onclick="handleRegionClick(7)"/>
      <path id="reg-8" d="M 220,70 L 340,70 L 330,150 L 210,150 Z" fill="#94a3b8" onclick="handleRegionClick(8)"/>
      <path id="reg-9" d="M 340,70 L 460,70 L 450,150 L 330,150 Z" fill="#94a3b8" onclick="handleRegionClick(9)"/>
      <path id="reg-10" d="M 460,70 L 590,70 L 590,150 L 450,150 Z" fill="#94a3b8" onclick="handleRegionClick(10)"/>

      <path id="reg-11" d="M 10,150 L 100,150 L 90,290 L 10,290 Z" fill="#94a3b8" onclick="handleRegionClick(11)"/>
      <path id="reg-12" d="M 100,150 L 210,150 L 200,290 L 90,290 Z" fill="#94a3b8" onclick="handleRegionClick(12)"/>
      <path id="reg-13" d="M 210,150 L 330,150 L 320,290 L 200,290 Z" fill="#94a3b8" onclick="handleRegionClick(13)"/>
      <path id="reg-14" d="M 330,150 L 450,150 L 440,290 L 320,290 Z" fill="#94a3b8" onclick="handleRegionClick(14)"/>
      <path id="reg-15" d="M 450,150 L 590,150 L 590,290 L 440,290 Z" fill="#94a3b8" onclick="handleRegionClick(15)"/>

      <!-- Bölge Metinleri -->
      <g id="region-labels"></g>
    </svg>
  </div>

  <div id="modal-overlay">
    <div class="modal-box">
      <h3 id="modal-title">Soru</h3>
      <p id="modal-desc" style="margin:10px 0; font-size:14px;"></p>
      <div id="modal-options"></div>
    </div>
  </div>

  <script>
    const colors = { 1: "#ef4444", 2: "#3b82f6", 3: "#22c55e", 4: "#eab308" };
    let regions = {}; // { id: { owner: null, points: 0, isCastle: false } }
    let scores = { 1: 0, 2: 0, 3: 0, 4: 0 };
    let activePlayer = 1;
    let phase = "CASTLE"; // CASTLE -> SELECT -> BATTLE
    let timer = null;
    let timeLeft = 10;
    let currentTargetRegion = null;

    const questions = [
      { q: "Türkiye'nin başkenti neresidir?", opts: ["İstanbul", "Ankara", "İzmir", "Bursa"], a: 1 },
      { q: "Fatih Sultan Mehmet İstanbul'u kaç yılında fethetmiştir?", opts: ["1071", "1453", "1299", "1923"], a: 1 },
      { q: "Dünyanın en geniş okyanusu hangisidir?", opts: ["Atlas", "Hint", "Pasifik", "Arktik"], a: 2 }
    ];

    // Oyunu Başlat
    function initGame() {
      for (let i = 1; i <= 15; i++) {
        regions[i] = { owner: null, points: 0, isCastle: false };
      }
      startTimer();
      updateStatus("KALE SEÇİMİ: 1. Oyuncu Kalesini Seçsin");
    }

    function startTimer() {
      clearInterval(timer);
      timeLeft = 10;
      document.getElementById('time-left').innerText = timeLeft;
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('time-left').innerText = timeLeft;
        if (timeLeft <= 0) {
          autoSelect();
        }
      }, 1000);
    }

    // Seçim yapılmazsa 10 sn sonunda rastgele atama
    function autoSelect() {
      let emptyRegions = Object.keys(regions).filter(id => regions[id].owner === null);
      if (emptyRegions.length > 0) {
        let randomId = emptyRegions[Math.floor(Math.random() * emptyRegions.length)];
        handleRegionClick(parseInt(randomId));
      }
    }

    function handleRegionClick(regId) {
      if (regions[regId].owner !== null && phase !== "BATTLE") return;

      if (phase === "CASTLE") {
        // Kale Kurulumu (1000 Puan)
        regions[regId] = { owner: activePlayer, points: 1000, isCastle: true };
        scores[activePlayer] += 1000;
        updateRegionUI(regId);

        activePlayer++;
        if (activePlayer > 4) {
          activePlayer = 1;
          phase = "SELECT";
          updateStatus("BÖLGE PAYLAŞIMI: 1. Oyuncu Bölge Seçiyor");
        } else {
          updateStatus(`KALE SEÇİMİ: ${activePlayer}. Oyuncu Kalesini Seçsin`);
        }
        startTimer();

      } else if (phase === "SELECT") {
        // Normal Bölge Seçimi (200 Puan)
        regions[regId] = { owner: activePlayer, points: 200, isCastle: false };
        scores[activePlayer] += 200;
        updateRegionUI(regId);

        let emptyLeft = Object.keys(regions).some(id => regions[id].owner === null);
        if (!emptyLeft) {
          phase = "BATTLE";
          activePlayer = 1;
          clearInterval(timer);
          updateStatus("SAVAŞ EVRESİ: Saldırılacak Rakip Bölgeyi Seçin");
        } else {
          activePlayer = (activePlayer % 4) + 1;
          updateStatus(`BÖLGE PAYLAŞIMI: ${activePlayer}. Oyuncu Bölge Seçiyor`);
          startTimer();
        }

      } else if (phase === "BATTLE") {
        // Saldırı Mekaniği
        if (regions[regId].owner === activePlayer) return; // Kendi bölgesine saldıramaz
        currentTargetRegion = regId;
        openQuestionModal();
      }
      
      renderScores();
    }

    function openQuestionModal() {
      clearInterval(timer);
      const q = questions[Math.floor(Math.random() * questions.length)];
      document.getElementById('modal-title').innerText = `${activePlayer}. Oyuncu Saldırıyor!`;
      document.getElementById('modal-desc').innerText = q.q;
      
      const optsDiv = document.getElementById('modal-options');
      optsDiv.innerHTML = '';

      q.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-opt';
        btn.innerText = opt;
        btn.onclick = () => processBattle(idx === q.a);
        optsDiv.appendChild(btn);
      });

      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function processBattle(isCorrect) {
      document.getElementById('modal-overlay').style.display = 'none';
      let target = regions[currentTargetRegion];
      let defender = target.owner;

      if (isCorrect) {
        alert("Saldırı Başarılı! Bölge Ele Geçirildi.");
        
        if (target.isCastle) {
          // KALE YOK EDİLDİ: Tüm puanlar ve bölgeler fetheden oyuncuya geçer!
          alert(`🏰 ${defender}. OYUNCUNUN KALESİ YIKILDI! Tüm bölgeleri ${activePlayer}. oyuncuya geçti!`);
          
          Object.keys(regions).forEach(rId => {
            if (regions[rId].owner === defender) {
              regions[rId].owner = activePlayer;
              updateRegionUI(rId);
            }
          });

          scores[activePlayer] += scores[defender];
          scores[defender] = 0;
        } else {
          // Normal Bölge Fethi
          scores[defender] -= target.points;
          scores[activePlayer] += target.points;
          target.owner = activePlayer;
          updateRegionUI(currentTargetRegion);
        }
      } else {
        alert("Yanlış Cevap! Saldırı Başarısız.");
      }

      activePlayer = (activePlayer % 4) + 1;
      renderScores();
      updateStatus(`SAVAŞ EVRESİ: ${activePlayer}. Oyuncu Saldıracak Bölge Seçiyor`);
    }

    function updateRegionUI(regId) {
      const regObj = regions[regId];
      const el = document.getElementById(`reg-${regId}`);
      el.setAttribute('fill', colors[regObj.owner]);
    }

    function renderScores() {
      for (let i = 1; i <= 4; i++) {
        document.getElementById(`s${i}`).innerText = scores[i];
      }
    }

    function updateStatus(msg) {
      document.getElementById('phase-title').innerText = msg;
    }

    window.onload = initGame;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenTrivia Client</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121212; color: #fff; padding: 20px; text-align: center; }
    .card { background: #1e1e1e; max-width: 500px; margin: 20px auto; padding: 20px; border-radius: 8px; }
    input, button { padding: 10px; margin: 8px 0; width: 100%; border-radius: 4px; border: none; font-size: 16px; }
    button { background: #6200ee; color: #fff; cursor: pointer; }
    button:hover { background: #3700b3; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .player-list { text-align: left; margin-top: 10px; }
    .player-item { display: flex; justify-content: space-between; padding: 8px; background: #2c2c2c; margin-bottom: 4px; border-radius: 4px; }
  </style>
</head>
<body>

  <h1>OpenTrivia</h1>

  <!-- Lobi Giriş Ekranı -->
  <div id="join-screen" class="card">
    <h2>Oyuna Katıl</h2>
    <input type="text" id="username-input" placeholder="Kullanıcı Adı Girin">
    <button onclick="joinGame()">Lobiye Katıl</button>
  </div>

  <!-- Oyun Ekranı -->
  <div id="game-screen" class="card" style="display: none;">
    <button onclick="startGame()" id="start-btn">Oyunu Başlat</button>
    <div id="question-box" style="display: none;">
      <h3 id="question-text">Soru Yükleniyor...</h3>
      <div class="options-grid" id="options-container"></div>
    </div>
  </div>

  <!-- Skor Ekranı -->
  <div class="card">
    <h3>Canlı Sıralama</h3>
    <div id="players-container" class="player-list"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>

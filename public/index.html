<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dört Krallık Savaşı - Bil ve Fethet Stili</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0c1322; color: #fff; text-align: center; }
    header { padding: 14px; background: #151d30; font-size: 20px; font-weight: bold; border-bottom: 2px solid #2d3748; letter-spacing: 1px; }

    #scoreboard { display: flex; justify-content: space-around; padding: 12px; background: #1e293b; gap: 8px; }
    .player-card { flex: 1; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 13px; border: 2px solid rgba(255,255,255,0.2); }
    .player-card.eliminated { opacity: 0.25; filter: grayscale(1); }

    #game-container { position: relative; max-width: 750px; margin: 15px auto; padding: 0 10px; }
    #status-bar { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 12px; background: #1e293b; padding: 8px; border-radius: 6px; }

    /* SVG Harita Stilleri */
    svg { width: 100%; height: auto; background: #131c2e; border-radius: 16px; border: 4px solid #2a3a5c; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    
    /* Bölge Renk Sınırları ve Efektler */
    .region-path { cursor: pointer; transition: all 0.25s ease; stroke-linejoin: round; }
    .region-path:hover { filter: brightness(1.25); opacity: 0.9; }

    /* Asker, Kale ve Puan Metin Yazıları */
    .map-text { font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; pointer-events: none; text-shadow: 1px 1px 3px #000, -1px -1px 3px #000; }
    .unit-icon { font-size: 16px; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
    
    /* Modal Arayüzü */
    #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 999; }
    .modal-box { background: #1e293b; padding: 22px; border-radius: 12px; max-width: 440px; width: 90%; border: 1px solid #475569; }
    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .btn-action { width: 100%; padding: 12px; margin: 5px 0; background: #3b82f6; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-cat { background: #8b5cf6; } .btn-cat:hover { background: #7c3aed; }
    .btn-danger { background: #ef4444; }
  </style>
</head>
<body>

  <header>⚔️ DÖRT KRALLIK SAVAŞI - ÖZEL HARİTA ⚔️</header>

  <div id="scoreboard">
    <div id="p1" class="player-card" style="background:#dc2626">1. KUZEY (Kırmızı)<br><span id="s1">1000</span> P</div>
    <div id="p2" class="player-card" style="background:#2563eb">2. BATI (Mavi)<br><span id="s2">1000</span> P</div>
    <div id="p3" class="player-card" style="background:#16a34a">3. DOĞU (Yeşil)<br><span id="s3">1000</span> P</div>
    <div id="p4" class="player-card" style="background:#ca8a04">4. GÜNEY (Sarı)<br><span id="s4">1000</span> P</div>
  </div>

  <div id="game-container">
    <div id="status-bar">Süre: <span id="time-left">10</span>s | <span id="phase-title">Savaş Başlıyor...</span></div>
    
    <svg viewBox="0 0 800 800" id="map-svg">
      
      <!-- KUZEY BÖLGELERİ -->
      <path id="reg-kuzey-kale" class="region-path" d="M 320,30 L 480,30 L 480,120 L 320,120 Z" fill="#334155" stroke="#64748b" stroke-width="3.5" onclick="handleRegionClick('kuzey-kale')"/>
      <path id="reg-kuzey-a" class="region-path" d="M 160,130 L 390,130 L 390,230 L 260,230 Z" fill="#334155" stroke="#64748b" stroke-width="3.5" onclick="handleRegionClick('kuzey-a')"/>
      <path id="reg-kuzey-b" class="region-path" d="M 410,130 L 640,130 L 540,230 L 410,230 Z" fill="#334155" stroke="#64748b" stroke-width="3.5" onclick="handleRegionClick('kuzey-b')"/>

      <!-- BATI BÖLGELERİ -->
      <path id="reg-bati-a" class="region-path" d="M 140,240 L 250,240 L 250,390 L 140,340 Z" fill="#334155" stroke="#64748b" stroke-width="3.5" onclick="handleRegionClick('bati-a')"/>
      <path id="reg-bati-kale" class="region-path" d="M 30,350 L 130,350 L 130,450 L 30,450 Z" fill="#334155" stroke="#64748b" stroke-width="3.5" onclick="handleRegionClick('bati-kale')"/>
      <path id="reg-bati-b" class="region-path" d="M 140,400 L 250,400 L 250,550 L 140,550 Z" fill="#334155" stroke="#64748b" stroke-width="3.5" onclick="handleRegionClick('bati-b')"/>

      <!-- DOĞU BÖLGELERİ -->
      <path id="reg-dogu-a" class="region-path" d="M 550,400 L 660,400 L 660,550 L 550,550 Z" fill="#334155" stroke="#64748b" stroke-width="3.5" onclick="handleRegionClick('dogu-a')"/>
      <path id="reg-dogu-kale" class="region-path" d="M 670,350 L 770,350 L 770,450 L 670,450 Z" fill="#334155" stroke="#64748b" stroke-width="3.5" onclick="handleRegionClick('dogu-kale')"/>
      <path id="reg-dogu-b" class="region-path" d="M 550,240 L 660,240 L 660,390 L 550,390 Z" fill="#334155" stroke="#64748b" stroke-width="3.5" onclick="handleRegionClick('dogu-b')"/>

      <!-- GÜNEY BÖLGELERİ -->
      <path id="reg-guney-b" class="region-path" d="M 160,660 L 390,660 L 390,560 L 260,560 Z" fill="#334155" stroke="#64748b" stroke-width="3.5" onclick="handleRegionClick('guney-b')"/>
      <path id="reg-guney-kale" class="region-path" d="M 320,670 L 480,670 L 480,760 L 320,760 Z" fill="#334155" stroke="#64748b" stroke-width="3.5" onclick="handleRegionClick('guney-kale')"/>
      <path id="reg-guney-a" class="region-path" d="M 410,660 L 640,660 L 540,560 L 410,560 Z" fill="#334155" stroke="#64748b" stroke-width="3.5" onclick="handleRegionClick('guney-a')"/>

      <!-- MERKEZ (BÖLGE 16 / TAPINAK) -->
      <circle id="reg-merkez" class="region-path" cx="400" cy="395" r="110" fill="#334155" stroke="#64748b" stroke-width="4" onclick="handleRegionClick('merkez')"/>

      <!-- Dinamik Katman: Asker İkonları ve Metinler -->
      <g id="map-labels"></g>
    </svg>
  </div>

  <div id="modal-overlay">
    <div class="modal-box" id="modal-content"></div>
  </div>

  <script>
    // Oyuncu Renk Kodları (Dolgu ve Sınır Hatları)
    const playerColors = {
      1: { fill: "#7f1d1d", stroke: "#ef4444" }, // Kırmızı (Kuzey)
      2: { fill: "#1e3a8a", stroke: "#3b82f6" }, // Mavi (Batı)
      3: { fill: "#14532d", stroke: "#22c55e" }, // Yeşil (Doğu)
      4: { fill: "#713f12", stroke: "#eab308" }  // Sarı (Güney)
    };

    // Bölge Merkez Koordinatları (İkon ve Puan Konumlandırmaları)
    const centers = {
      'kuzey-kale': [400, 75], 'kuzey-a': [290, 180], 'kuzey-b': [510, 180],
      'bati-kale': [80, 400],  'bati-a': [195, 290],  'bati-b': [195, 480],
      'dogu-kale': [720, 400], 'dogu-a': [605, 480],  'dogu-b': [605, 290],
      'guney-kale': [400, 715], 'guney-b': [290, 610], 'guney-a': [510, 610],
      'merkez': [400, 395]
    };

    // Bölge Komşuluk Ağı
    const neighbors = {
      'kuzey-kale': ['kuzey-a', 'kuzey-b'],
      'kuzey-a': ['kuzey-kale', 'kuzey-b', 'bati-a', 'merkez'],
      'kuzey-b': ['kuzey-kale', 'kuzey-a', 'dogu-b', 'merkez'],
      'bati-kale': ['bati-a', 'bati-b'],
      'bati-a': ['bati-kale', 'kuzey-a', 'merkez'],
      'bati-b': ['bati-kale', 'guney-b', 'merkez'],
      'dogu-kale': ['dogu-a', 'dogu-b'],
      'dogu-a': ['dogu-kale', 'guney-a', 'merkez'],
      'dogu-b': ['dogu-kale', 'kuzey-b', 'merkez'],
      'guney-kale': ['guney-a', 'guney-b'],
      'guney-a': ['guney-kale', 'guney-b', 'dogu-a', 'merkez'],
      'guney-b': ['guney-kale', 'guney-a', 'bati-b', 'merkez'],
      'merkez': ['kuzey-a', 'kuzey-b', 'bati-a', 'bati-b', 'dogu-a', 'dogu-b', 'guney-a', 'guney-b']
    };

    let regions = {};
    let scores = { 1: 1000, 2: 1000, 3: 1000, 4: 1000 };
    let activePlayer = 1;
    let phase = "SELECT";
    let timer = null;
    let timeLeft = 10;
    let currentTargetReg = null;

    function initGame() {
      // Bölgeleri İlklendir
      Object.keys(centers).forEach(key => {
        regions[key] = { owner: null, points: 0, isCastle: false };
      });

      // Başlangıç Kalelerini Atama
      setupCastle('kuzey-kale', 1);
      setupCastle('bati-kale', 2);
      setupCastle('dogu-kale', 3);
      setupCastle('guney-kale', 4);

      renderMapUI();
      startTurn();
    }

    function setupCastle(regId, pId) {
      regions[regId] = { owner: pId, points: 1000, isCastle: true };
    }

    function renderMapUI() {
      const labelsGroup = document.getElementById('map-labels');
      labelsGroup.innerHTML = '';

      Object.keys(regions).forEach(regId => {
        const reg = regions[regId];
        const pathElem = document.getElementById(`reg-${regId}`);
        const center = centers[regId];

        if (reg.owner !== null) {
          // Sahibinin Rengi ve Sınırını Uygula
          pathElem.setAttribute('fill', playerColors[reg.owner].fill);
          pathElem.setAttribute('stroke', playerColors[reg.owner].stroke);
          pathElem.setAttribute('stroke-width', '4');

          // Asker veya Kale İkonu Ekle
          const icon = document.createElementNS("http://www.w3.org/2000/svg", "text");
          icon.setAttribute("x", center[0]);
          icon.setAttribute("y", center[1] - 10);
          icon.setAttribute("class", "unit-icon");
          icon.textContent = reg.isCastle ? "🏰" : "💂";
          labelsGroup.appendChild(icon);

          // Puan Etiketi Ekle
          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("x", center[0]);
          text.setAttribute("y", center[1] + 12);
          text.setAttribute("class", "map-text");
          text.textContent = reg.isCastle ? `${reg.points} P` : `${reg.points} P`;
          labelsGroup.appendChild(text);
        } else {
          // Boş Bölge Görünümü
          pathElem.setAttribute('fill', '#1e293b');
          pathElem.setAttribute('stroke', '#475569');
          pathElem.setAttribute('stroke-width', '2');

          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("x", center[0]);
          text.setAttribute("y", center[1]);
          text.setAttribute("class", "map-text");
          text.setAttribute("fill", "#94a3b8");
          text.textContent = regId === 'merkez' ? "MERKEZ" : "Boş";
          labelsGroup.appendChild(text);
        }
      });

      // Skor Tablosunu Güncelle
      for (let i = 1; i <= 4; i++) {
        document.getElementById(`s${i}`).innerText = scores[i];
      }
    }

    function getValidSelectableRegions(player) {
      let ownedRegs = Object.keys(regions).filter(id => regions[id].owner === player);
      let validTargets = new Set();

      ownedRegs.forEach(regId => {
        neighbors[regId].forEach(nId => {
          if (regions[nId].owner === null) {
            validTargets.add(nId);
          }
        });
      });

      return Array.from(validTargets);
    }

    function startTurn() {
      if (activePlayer === 1) {
        document.getElementById('phase-title').innerText = "Sizin Turunuz: Yakın Bir Bölge Seçin";
        startTimer();
      } else {
        document.getElementById('phase-title').innerText = `${activePlayer}. Bot Hamle Yapıyor...`;
        clearInterval(timer);
        setTimeout(botMove, 1000);
      }
    }

    function startTimer() {
      clearInterval(timer);
      timeLeft = 10;
      document.getElementById('time-left').innerText = timeLeft;
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('time-left').innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          autoSelect();
        }
      }, 1000);
    }

    function autoSelect() {
      let validList = getValidSelectableRegions(activePlayer);
      if (validList.length > 0) {
        handleRegionClick(validList[0]);
      }
    }

    function handleRegionClick(regId) {
      if (activePlayer !== 1) return;
      if (regions[regId].owner !== null && phase === "SELECT") return;

      if (phase === "SELECT") {
        let validList = getValidSelectableRegions(activePlayer);
        if (validList.length > 0 && !validList.includes(regId)) {
          alert("Sadece kendi bölgelerinize komşu olan yerleri seçebilirsiniz!");
          return;
        }

        clearInterval(timer);
        regions[regId] = { owner: activePlayer, points: 200, isCastle: false };
        scores[activePlayer] += 200;
        renderMapUI();

        let emptyLeft = Object.keys(regions).some(i => regions[i].owner === null);
        if (!emptyLeft) {
          phase = "BATTLE";
          activePlayer = 1;
          alert("Tüm Harita Paylaşıldı! Savaş Fazı Başlıyor.");
        } else {
          activePlayer = (activePlayer % 4) + 1;
        }
        startTurn();
      }
    }

    function botMove() {
      if (phase === "SELECT") {
        let validList = getValidSelectableRegions(activePlayer);
        if (validList.length > 0) {
          let choice = validList[Math.floor(Math.random() * validList.length)];
          regions[choice] = { owner: activePlayer, points: 200, isCastle: false };
          scores[activePlayer] += 200;
          renderMapUI();
        }

        let emptyLeft = Object.keys(regions).some(i => regions[i].owner === null);
        if (!emptyLeft) {
          phase = "BATTLE";
          activePlayer = 1;
          alert("Tüm Harita Paylaşıldı! Savaş Fazı Başlıyor.");
        } else {
          activePlayer = (activePlayer % 4) + 1;
        }
        startTurn();
      }
    }

    window.onload = initGame;
  </script>
</body>
</html>

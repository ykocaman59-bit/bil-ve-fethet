<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dört Krallık Savaşı - Bil ve Fethet Stili</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0c1322; color: #fff; text-align: center; }
    header { padding: 14px; background: #151d30; font-size: 20px; font-weight: bold; border-bottom: 2px solid #2d3748; letter-spacing: 1px; }

    #scoreboard { display: flex; justify-content: space-around; padding: 12px; background: #1e293b; gap: 8px; }
    .player-card { flex: 1; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 13px; border: 2px solid rgba(255,255,255,0.2); }
    .player-card.eliminated { opacity: 0.25; filter: grayscale(1); }

    #game-container { position: relative; max-width: 900px; margin: 15px auto; padding: 0 10px; }
    #status-bar { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 12px; background: #1e293b; padding: 8px; border-radius: 6px; }

    /* Harita Kapsayıcısı ve Resim Arkaplanı */
    .map-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      border: 4px solid #2a3a5c;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      overflow: hidden;
      background: #131c2e;
    }

    .map-bg-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* SVG Harita Katmanı */
    svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    /* Bölge Renk Sınırları ve Efektler */
    .region-path { cursor: pointer; transition: all 0.25s ease; stroke-linejoin: round; }
    .region-path:hover { filter: brightness(1.3); opacity: 0.85; }

    /* Asker, Kale ve Puan Metin Yazıları */
    .map-text { font-size: 14px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; pointer-events: none; text-shadow: 1px 1px 4px #000, -1px -1px 4px #000; }
    .unit-icon { font-size: 20px; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
    
    /* Modal Arayüzü */
    #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 999; }
    .modal-box { background: #1e293b; padding: 22px; border-radius: 12px; max-width: 440px; width: 90%; border: 1px solid #475569; }
    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .btn-action { width: 100%; padding: 12px; margin: 5px 0; background: #3b82f6; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-cat { background: #8b5cf6; } .btn-cat:hover { background: #7c3aed; }
    .btn-danger { background: #ef4444; }
  </style>
</head>
<body>

  <header>⚔️ DÖRT KRALLIK SAVAŞI - ÖZEL HARİTA ⚔️</header>

  <div id="scoreboard">
    <div id="p1" class="player-card" style="background:#dc2626">1. KUZEY (Kırmızı)<br><span id="s1">1000</span> P</div>
    <div id="p2" class="player-card" style="background:#2563eb">2. BATI (Mavi)<br><span id="s2">1000</span> P</div>
    <div id="p3" class="player-card" style="background:#16a34a">3. DOĞU (Yeşil)<br><span id="s3">1000</span> P</div>
    <div id="p4" class="player-card" style="background:#ca8a04">4. GÜNEY (Sarı)<br><span id="s4">1000</span> P</div>
  </div>

  <div id="game-container">
    <div id="status-bar">Süre: <span id="time-left">10</span>s | <span id="phase-title">Savaş Başlıyor...</span></div>
    
    <div class="map-wrapper">
      <!-- Gerçek İllüstrasyon Görsel (Dosya yolunuzu buraya yazın) -->
      <img src="harita.jpg" alt="Dört Krallık Haritası" class="map-bg-img">

      <!-- İnteraktif SVG Poligon Katmanı -->
      <svg viewBox="0 0 1000 562.5" id="map-svg">
        
        <!-- KUZEY BÖLGELERİ -->
        <polygon id="reg-kuzey-kale" class="region-path" points="440,20 560,20 550,120 450,120" fill="transparent" stroke="rgba(255,255,255,0.3)" stroke-width="2" onclick="handleRegionClick('kuzey-kale')"/>
        <polygon id="reg-kuzey-a" class="region-path" points="300,70 430,120 370,190 250,130" fill="transparent" stroke="rgba(255,255,255,0.3)" stroke-width="2" onclick="handleRegionClick('kuzey-a')"/>
        <polygon id="reg-kuzey-b" class="region-path" points="570,120 700,70 750,130 630,190" fill="transparent" stroke="rgba(255,255,255,0.3)" stroke-width="2" onclick="handleRegionClick('kuzey-b')"/>

        <!-- BATI BÖLGELERİ -->
        <polygon id="reg-bati-a" class="region-path" points="180,120 300,160 260,260 160,210" fill="transparent" stroke="rgba(255,255,255,0.3)" stroke-width="2" onclick="handleRegionClick('bati-a')"/>
        <polygon id="reg-bati-kale" class="region-path" points="60,220 160,210 180,330 70,340" fill="transparent" stroke="rgba(255,255,255,0.3)" stroke-width="2" onclick="handleRegionClick('bati-kale')"/>
        <polygon id="reg-bati-b" class="region-path" points="180,330 260,290 290,400 180,430" fill="transparent" stroke="rgba(255,255,255,0.3)" stroke-width="2" onclick="handleRegionClick('bati-b')"/>

        <!-- DOĞU BÖLGELERİ -->
        <polygon id="reg-dogu-b" class="region-path" points="700,160 820,120 840,210 740,260" fill="transparent" stroke="rgba(255,255,255,0.3)" stroke-width="2" onclick="handleRegionClick('dogu-b')"/>
        <polygon id="reg-dogu-kale" class="region-path" points="840,210 940,220 930,340 820,330" fill="transparent" stroke="rgba(255,255,255,0.3)" stroke-width="2" onclick="handleRegionClick('dogu-kale')"/>
        <polygon id="reg-dogu-a" class="region-path" points="740,290 820,330 820,430 710,400" fill="transparent" stroke="rgba(255,255,255,0.3)" stroke-width="2" onclick="handleRegionClick('dogu-a')"/>

        <!-- GÜNEY BÖLGELERİ -->
        <polygon id="reg-guney-b" class="region-path" points="260,420 370,370 420,440 300,480" fill="transparent" stroke="rgba(255,255,255,0.3)" stroke-width="2" onclick="handleRegionClick('guney-b')"/>
        <polygon id="reg-guney-kale" class="region-path" points="440,440 560,440 550,540 450,540" fill="transparent" stroke="rgba(255,255,255,0.3)" stroke-width="2" onclick="handleRegionClick('guney-kale')"/>
        <polygon id="reg-guney-a" class="region-path" points="630,370 740,420 700,480 580,440" fill="transparent" stroke="rgba(255,255,255,0.3)" stroke-width="2" onclick="handleRegionClick('guney-a')"/>

        <!-- MERKEZ (BÖLGE 16 / TAPINAK) -->
        <polygon id="reg-merkez" class="region-path" points="400,240 600,240 650,330 350,330" fill="transparent" stroke="rgba(255,255,255,0.3)" stroke-width="2" onclick="handleRegionClick('merkez')"/>

        <!-- Dinamik Katman: Asker İkonları ve Metinler -->
        <g id="map-labels"></g>
      </svg>
    </div>
  </div>

  <div id="modal-overlay">
    <div class="modal-box" id="modal-content"></div>
  </div>

  <script>
    // Oyuncu Renk Kodları (Görseli Bozmayan Şeffaf Dolgu ve Parlak Sınır Hatları)
    const playerColors = {
      1: { fill: "rgba(220, 38, 38, 0.45)", stroke: "#ef4444" }, // Kırmızı (Kuzey)
      2: { fill: "rgba(37, 99, 235, 0.45)", stroke: "#3b82f6" }, // Mavi (Batı)
      3: { fill: "rgba(22, 163, 74, 0.45)", stroke: "#22c55e" }, // Yeşil (Doğu)
      4: { fill: "rgba(202, 138, 4, 0.45)", stroke: "#eab308" }  // Sarı (Güney)
    };

    // Bölge Merkez Koordinatları (İkon ve Puan Konumlandırmaları - Görsel Üzerine Tam Hizalı)
    const centers = {
      'kuzey-kale': [500, 70],  'kuzey-a': [335, 130], 'kuzey-b': [665, 130],
      'bati-kale': [120, 275],  'bati-a': [225, 185],  'bati-b': [230, 360],
      'dogu-kale': [885, 275],  'dogu-a': [775, 360],  'dogu-b': [775, 185],
      'guney-kale': [500, 490], 'guney-b': [335, 430], 'guney-a': [665, 430],
      'merkez': [500, 285]
    };

    // Bölge Komşuluk Ağı (Tamamen Aynı Tutuldu)
    const neighbors = {
      'kuzey-kale': ['kuzey-a', 'kuzey-b'],
      'kuzey-a': ['kuzey-kale', 'kuzey-b', 'bati-a', 'merkez'],
      'kuzey-b': ['kuzey-kale', 'kuzey-a', 'dogu-b', 'merkez'],
      'bati-kale': ['bati-a', 'bati-b'],
      'bati-a': ['bati-kale', 'kuzey-a', 'merkez'],
      'bati-b': ['bati-kale', 'guney-b', 'merkez'],
      'dogu-kale': ['dogu-a', 'dogu-b'],
      'dogu-a': ['dogu-kale', 'guney-a', 'merkez'],
      'dogu-b': ['dogu-kale', 'kuzey-b', 'merkez'],
      'guney-kale': ['guney-a', 'guney-b'],
      'guney-a': ['guney-kale', 'guney-b', 'dogu-a', 'merkez'],
      'guney-b': ['guney-kale', 'guney-a', 'bati-b', 'merkez'],
      'merkez': ['kuzey-a', 'kuzey-b', 'bati-a', 'bati-b', 'dogu-a', 'dogu-b', 'guney-a', 'guney-b']
    };

    let regions = {};
    let scores = { 1: 1000, 2: 1000, 3: 1000, 4: 1000 };
    let activePlayer = 1;
    let phase = "SELECT";
    let timer = null;
    let timeLeft = 10;
    let currentTargetReg = null;

    function initGame() {
      // Bölgeleri İlklendir
      Object.keys(centers).forEach(key => {
        regions[key] = { owner: null, points: 0, isCastle: false };
      });

      // Başlangıç Kalelerini Atama
      setupCastle('kuzey-kale', 1);
      setupCastle('bati-kale', 2);
      setupCastle('dogu-kale', 3);
      setupCastle('guney-kale', 4);

      renderMapUI();
      startTurn();
    }

    function setupCastle(regId, pId) {
      regions[regId] = { owner: pId, points: 1000, isCastle: true };
    }

    function renderMapUI() {
      const labelsGroup = document.getElementById('map-labels');
      labelsGroup.innerHTML = '';

      Object.keys(regions).forEach(regId => {
        const reg = regions[regId];
        const pathElem = document.getElementById(`reg-${regId}`);
        const center = centers[regId];

        if (reg.owner !== null) {
          // Sahibinin Rengi ve Sınırını Uygula
          pathElem.setAttribute('fill', playerColors[reg.owner].fill);
          pathElem.setAttribute('stroke', playerColors[reg.owner].stroke);
          pathElem.setAttribute('stroke-width', '3.5');

          // Asker veya Kale İkonu Ekle
          const icon = document.createElementNS("http://www.w3.org/2000/svg", "text");
          icon.setAttribute("x", center[0]);
          icon.setAttribute("y", center[1] - 12);
          icon.setAttribute("class", "unit-icon");
          icon.textContent = reg.isCastle ? "🏰" : "💂";
          labelsGroup.appendChild(icon);

          // Puan Etiketi Ekle
          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("x", center[0]);
          text.setAttribute("y", center[1] + 12);
          text.setAttribute("class", "map-text");
          text.textContent = `${reg.points} P`;
          labelsGroup.appendChild(text);
        } else {
          // Boş Bölge Görünümü (Resim Üzerinde Görünmez/Şeffaf Kalır)
          pathElem.setAttribute('fill', 'transparent');
          pathElem.setAttribute('stroke', 'rgba(255, 255, 255, 0.25)');
          pathElem.setAttribute('stroke-width', '1.5');
        }
      });

      // Skor Tablosunu Güncelle
      for (let i = 1; i <= 4; i++) {
        document.getElementById(`s${i}`).innerText = scores[i];
      }
    }

    function getValidSelectableRegions(player) {
      let ownedRegs = Object.keys(regions).filter(id => regions[id].owner === player);
      let validTargets = new Set();

      ownedRegs.forEach(regId => {
        neighbors[regId].forEach(nId => {
          if (regions[nId].owner === null) {
            validTargets.add(nId);
          }
        });
      });

      return Array.from(validTargets);
    }

    function startTurn() {
      if (activePlayer === 1) {
        document.getElementById('phase-title').innerText = "Sizin Turunuz: Yakın Bir Bölge Seçin";
        startTimer();
      } else {
        document.getElementById('phase-title').innerText = `${activePlayer}. Bot Hamle Yapıyor...`;
        clearInterval(timer);
        setTimeout(botMove, 1000);
      }
    }

    function startTimer() {
      clearInterval(timer);
      timeLeft = 10;
      document.getElementById('time-left').innerText = timeLeft;
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('time-left').innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          autoSelect();
        }
      }, 1000);
    }

    function autoSelect() {
      let validList = getValidSelectableRegions(activePlayer);
      if (validList.length > 0) {
        handleRegionClick(validList[0]);
      }
    }

    function handleRegionClick(regId) {
      if (activePlayer !== 1) return;
      if (regions[regId].owner !== null && phase === "SELECT") return;

      if (phase === "SELECT") {
        let validList = getValidSelectableRegions(activePlayer);
        if (validList.length > 0 && !validList.includes(regId)) {
          alert("Sadece kendi bölgelerinize komşu olan yerleri seçebilirsiniz!");
          return;
        }

        clearInterval(timer);
        regions[regId] = { owner: activePlayer, points: 200, isCastle: false };
        scores[activePlayer] += 200;
        renderMapUI();

        let emptyLeft = Object.keys(regions).some(i => regions[i].owner === null);
        if (!emptyLeft) {
          phase = "BATTLE";
          activePlayer = 1;
          alert("Tüm Harita Paylaşıldı! Savaş Fazı Başlıyor.");
        } else {
          activePlayer = (activePlayer % 4) + 1;
        }
        startTurn();
      }
    }

    function botMove() {
      if (phase === "SELECT") {
        let validList = getValidSelectableRegions(activePlayer);
        if (validList.length > 0) {
          let choice = validList[Math.floor(Math.random() * validList.length)];
          regions[choice] = { owner: activePlayer, points: 200, isCastle: false };
          scores[activePlayer] += 200;
          renderMapUI();
        }

        let emptyLeft = Object.keys(regions).some(i => regions[i].owner === null);
        if (!emptyLeft) {
          phase = "BATTLE";
          activePlayer = 1;
          alert("Tüm Harita Paylaşıldı! Savaş Fazı Başlıyor.");
        } else {
          activePlayer = (activePlayer % 4) + 1;
        }
        startTurn();
      }
    }

    window.onload = initGame;
  </script>
</body>
</html>
